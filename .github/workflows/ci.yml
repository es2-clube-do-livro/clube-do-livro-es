# Checagens em todo push, em qualquer branch, no Linux, no macOS e no Windows.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Os hooks do Git servem só para os commits feitos nas máquinas do grupo.
  HUSKY: 0

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Estes passos passam a valer quando os scripts existirem no package.json.
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm run test:coverage
      - name: Publicar resumo da cobertura
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Cobertura ($RUNNER_OS)"
            if [[ ! -s coverage/summary.txt ]]; then
              echo 'A execução terminou sem gerar o relatório de cobertura.'
              exit 1
            fi
            echo '```text'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  producao:
    name: Publicar no Firebase Hosting
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: firebase-hosting-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Conferir o commit atual da main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '"sha=" + .object.sha' >> "$GITHUB_OUTPUT"

      - name: Identificar o secret do projeto Firebase
        id: firebase
        if: steps.main.outputs.sha == github.sha
        env:
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [[ ! "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo '::error::Configure a variável FIREBASE_PROJECT_ID com o ID do projeto.'
            exit 1
          fi
          echo "secret=FIREBASE_SERVICE_ACCOUNT_${PROJECT_ID^^}" | tr '-' '_' >> "$GITHUB_OUTPUT"

      - name: Publicar o site
        if: steps.main.outputs.sha == github.sha
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          firebaseServiceAccount: ${{ secrets[steps.firebase.outputs.secret] }}
          firebaseToolsVersion: 15.37.0
          channelId: live
